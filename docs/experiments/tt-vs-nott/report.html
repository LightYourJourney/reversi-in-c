<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reversi experiment</title><style>body{font-family:system-ui,sans-serif;margin:2rem;max-width:900px;background:#111;color:#eee}table{border-collapse:collapse;margin:1rem 0}td,th{border:1px solid #444;padding:.35rem .7rem;text-align:left}th{background:#222}.bar{height:1.1rem;background:#3b82f6;margin:.2rem 0}.bar.b{background:#f59e0b}.row{display:flex;align-items:center;gap:.6rem}.row span{min-width:5rem}small{color:#aaa}a{color:#7dd3fc}</style></head><body><h1>Reversi experiment</h1><div id="app"></div><p><a href="games.csv">games.csv</a> · <a href="moves.csv">moves.csv</a> · <a href="summary.json">summary.json</a></p><p><small>All values below are read from the embedded summary; raw data is in the CSV files.</small></p><script id="exp-data" type="application/json">{"format":"reversi-experiment-1","name":"tt-vs-nott","seed":20261025,"games":8,"openings":2,"opening_ply":4,"max_plies":100,"manifest":{"commit":"6ae6e01","os":"Darwin 25.6.0 arm64","cpu":"Apple M3","compiler":"AppleClang 21.0.0.21000334","build_type":"Release","data_version":"config-1/raw-1/openings-1"},"engines":[{"name":"TT","kind":"search","difficulty":2,"depth":6,"time_ms":10000,"max_nodes":0,"tt":true,"endgame":false,"seed":1},{"name":"NoTT","kind":"search","difficulty":2,"depth":6,"time_ms":10000,"max_nodes":0,"tt":false,"endgame":false,"seed":1}],"summary":{"games":8,"completed":8,"a_wins":4,"b_wins":4,"draws":0,"illegal":0,"timeouts":0,"node_limited":0,"aborted":0,"strength_games":8,"excluded_unpaired":0,"a_black_wins":4,"a_white_wins":0,"b_black_wins":4,"b_white_wins":0,"a_score":0.500000,"score_low":0.150036,"score_high":0.849964,"elo":0.00,"elo_low":-301.28,"elo_high":301.28,"elo_defined":true,"peak_rss_kb":5600},"a_stats":{"moves":224,"nodes":1383640,"nps":44069.2,"elapsed_ms":31397,"avg_ms":140,"p50_ms":26,"p95_ms":645,"max_ms":1535,"avg_depth":5,"max_depth":6,"cutoffs":319100,"tt_hits":17780,"timeouts":0,"node_limits":0,"cancellations":0},"b_stats":{"moves":224,"nodes":3109902,"nps":39254.0,"elapsed_ms":79225,"avg_ms":353,"p50_ms":67,"p95_ms":1778,"max_ms":3383,"avg_depth":5,"max_depth":6,"cutoffs":621756,"tt_hits":0,"timeouts":0,"node_limits":0,"cancellations":0},"anomalies":[]}</script><script>const d=JSON.parse(document.getElementById('exp-data').textContent);const app=document.getElementById('app');function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function table(rows){const t=el('table');for(const r of rows){const tr=el('tr');for(const c of r){const cell=r.head?el('th'):el('td');cell.textContent=c;tr.appendChild(cell)}t.appendChild(tr)}return t}const s=d.summary,a=d.engines[0],b=d.engines[1];app.appendChild(el('p',null,`${a.name} vs ${b.name} · seed ${d.seed} · ${s.games} games (${s.completed} completed)`));app.appendChild(el('h2',null,'Configuration'));const info=[['Commit',d.manifest.commit],['OS',d.manifest.os],['CPU',d.manifest.cpu],['Compiler',d.manifest.compiler],['Build',d.manifest.build_type],['Data',d.manifest.data_version]];app.appendChild(table([...info.map(x=>[x[0],x[1]])]));app.appendChild(el('h2',null,'Results'));const max=Math.max(1,s.a_wins,s.b_wins,s.draws);for(const [label,value,cls] of [[a.name+' wins',s.a_wins,''],[b.name+' wins',s.b_wins,'b'],['Draws',s.draws,'b']]){const row=el('div','row');row.appendChild(el('span',null,label));const bar=el('div','bar '+cls);bar.style.width=(value/max*60)+'%';row.appendChild(bar);row.appendChild(el('span',null,value));app.appendChild(row)}app.appendChild(table([['Metric','Value'],['A score',s.a_score.toFixed(3)+' (95% CI '+s.score_low.toFixed(3)+'..'+s.score_high.toFixed(3)+')'],['Elo',s.elo_defined?(s.elo>=0?'+':'')+s.elo.toFixed(0)+' ['+s.elo_low.toFixed(0)+'..'+s.elo_high.toFixed(0)+']':'n/a'],['Illegal',s.illegal],['Timeouts',s.timeouts],['Node-limit',s.node_limited],['Aborted',s.aborted],['Excluded unpaired',s.excluded_unpaired]]));app.appendChild(el('h2',null,'Search performance'));const perf=[['Metric',a.name,b.name],['Moves',s.a_stats.moves,s.b_stats.moves],['Nodes',s.a_stats.nodes,s.b_stats.nodes],['NPS',s.a_stats.nps.toFixed(0),s.b_stats.nps.toFixed(0)],['Avg ms',s.a_stats.avg_ms,s.b_stats.avg_ms],['P50 ms',s.a_stats.p50_ms,s.b_stats.p50_ms],['P95 ms',s.a_stats.p95_ms,s.b_stats.p95_ms],['Max depth',s.a_stats.max_depth,s.b_stats.max_depth],['Avg depth',s.a_stats.avg_depth,s.b_stats.avg_depth],['Cut rate %',(s.a_stats.nodes?100*s.a_stats.cutoffs/s.a_stats.nodes:0).toFixed(1),(s.b_stats.nodes?100*s.b_stats.cutoffs/s.b_stats.nodes:0).toFixed(1)],['TT hit %',(s.a_stats.nodes?100*s.a_stats.tt_hits/s.a_stats.nodes:0).toFixed(1),(s.b_stats.nodes?100*s.b_stats.tt_hits/s.b_stats.nodes:0).toFixed(1)],['Timeouts',s.a_stats.timeouts,s.b_stats.timeouts],['Node cap',s.a_stats.node_limits,s.b_stats.node_limits]];app.appendChild(table(perf));app.appendChild(el('p',null,'Elo is a two-engine logistic estimate; draws count as 0.5. Confidence intervals use paired openings as the independent unit; small samples are uncertain.'));app.appendChild(el('h2',null,'Anomalies'));if(!d.anomalies.length){app.appendChild(el('p',null,'None.'))}else{const rows=[['Game','illegal','timeout','node_limit','aborted']];for(const g of d.anomalies){rows.push([g.game,g.illegal,g.timeout,g.node_limit,g.aborted])}app.appendChild(table(rows))}</script></body></html>
