# Reversi Online TLS reverse proxy.
#
# The game server never speaks TLS: it binds 127.0.0.1 and nginx terminates
# HTTPS/WSS. Replace the host names, certificate paths and the static root
# before use. Validated with `nginx -t` and a local end-to-end run; see
# docs/PRODUCTION_DEPLOYMENT.md.
#
# The browser client connects to `<host>:<port>/` (the path is fixed), so the
# WebSocket endpoint is a dedicated host name rather than a path on the static
# site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One or two upgrades per player session; reconnects are rare. This stops
# programmatic room-code walking before it reaches the application.
limit_req_zone  $binary_remote_addr zone=reversi_upgrade:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=reversi_conn:10m;

# Static site: https://reversi.example.com
server {
    listen 80;
    server_name reversi.example.com ws.reversi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name reversi.example.com;

    ssl_certificate     /etc/letsencrypt/live/reversi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reversi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:reversi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Raise max-age only after HTTPS is verified everywhere. Do not preload
    # until the site has been stable for months.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    root /var/www/reversi;
    index index.html;
    client_max_body_size 1k;

    location / {
        try_files $uri $uri/ =404;
        # `expires` rather than add_header: a location-level add_header would
        # drop the server-level security headers in nginx.
        expires -1;
    }

    # The build is a fixed set of files; immutable assets can be cached for a
    # long time because a deploy replaces the whole directory.
    location ~* \.(wasm|data|js|png|ico)$ {
        expires 7d;
    }
}

# WebSocket endpoint: wss://ws.reversi.example.com:443/
server {
    listen 443 ssl;
    server_name ws.reversi.example.com;

    ssl_certificate     /etc/letsencrypt/live/reversi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reversi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:reversi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1k;

    location / {
        limit_req  zone=reversi_upgrade burst=10 nodelay;
        limit_conn reversi_conn 4;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        # The server caps idle connections at 120 s and clients ping every
        # 2 s; 300 s only bounds a wedged upgrade attempt.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
