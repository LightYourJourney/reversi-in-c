name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that creates the Release can write.
permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches VERSION
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # The Web client artifact comes along too; it is already inside each
          # package, so only the archives below are published.
          pattern: Reversi-*
          merge-multiple: true
          path: release-files

      - name: Generate SHA-256 sums
        working-directory: release-files
        shell: bash
        run: |
          shopt -s nullglob
          files=(Reversi-*.zip Reversi-*.tar.gz)
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          release-files/Reversi-*.zip release-files/Reversi-*.tar.gz
          release-files/*.sha256 release-files/SHA256SUMS
          --title "Reversi ${GITHUB_REF_NAME#v}"
          --generate-notes
