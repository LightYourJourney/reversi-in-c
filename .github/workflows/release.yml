name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DREVERSI_ENABLE_GUI_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release -B package

      - name: Normalize checksum line endings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/package/*.sha256 | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($_.FullName, $text)
          }

      - name: Windows package version smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/package/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath build/package/smoke -Force
          $exe = Get-ChildItem build/package/smoke -Recurse -Filter reversi.exe |
            Select-Object -First 1
          & $exe.FullName --version

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Reversi-${{ matrix.name }}
          path: |
            build/package/*.zip
            build/package/*.tar.gz
            build/package/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: Reversi-*
          merge-multiple: true
          path: release-files

      - name: Generate SHA-256 sums
        working-directory: release-files
        shell: bash
        run: |
          shopt -s nullglob
          files=(Reversi-*.zip Reversi-*.tar.gz)
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          release-files/*
          --title "Reversi ${GITHUB_REF_NAME#v}"
          --generate-notes
