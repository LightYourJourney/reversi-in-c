name: Package

# Shared Release packaging used by both CI and the tag-driven Release workflow.
# Callers choose only the artifact-name suffix; build, test, checksum
# normalization, the Windows version smoke, and upload stay in one place.

on:
  workflow_call:
    inputs:
      artifact_suffix:
        description: "Suffix appended to the uploaded artifact name"
        required: false
        type: string
        default: ""

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DREVERSI_ENABLE_GUI_TESTS=OFF
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release -B package

      - name: Normalize checksum line endings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/package/*.sha256 | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($_.FullName, $text)
          }

      - name: Windows package version smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/package/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath build/package/smoke -Force
          $exe = Get-ChildItem build/package/smoke -Recurse -Filter reversi.exe |
            Select-Object -First 1
          $root = Split-Path $exe.FullName -Parent
          $server = Join-Path $root 'bin/reversi_server.exe'

          # The package must carry its own OpenSSL runtime: the game links it
          # and so does the server, in a different directory.
          foreach ($dir in @($root, (Join-Path $root 'bin'))) {
            foreach ($pattern in @('libssl-*.dll', 'libcrypto-*.dll')) {
              if (-not (Get-ChildItem $dir -Filter $pattern -ErrorAction SilentlyContinue)) {
                throw "Missing $pattern in $dir"
              }
            }
          }

          # Run with a PATH that cannot reach a system OpenSSL, so a missing
          # bundled DLL fails here instead of on a user's machine.
          $env:PATH = "$root;C:\Windows\System32;C:\Windows"
          $output = (& $exe.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "reversi.exe --version exited with $LASTEXITCODE"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($output -notmatch "^Reversi $([regex]::Escape($version)) ") {
            throw "Unexpected version output: $output"
          }
          if (-not (Test-Path $server)) {
            throw "Missing bin/reversi_server.exe"
          }
          $help = (& $server --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'usage:') {
            throw "Packaged server does not start: $help"
          }

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Reversi-${{ matrix.name }}${{ inputs.artifact_suffix }}
          path: |
            build/package/*.zip
            build/package/*.tar.gz
            build/package/*.sha256
          if-no-files-found: error
