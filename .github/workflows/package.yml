name: Package

# Shared Release packaging used by both CI and the tag-driven Release workflow.
# Callers choose only the artifact-name suffix; build, test, checksum
# normalization, the Windows version smoke, and upload stay in one place.

on:
  workflow_call:
    inputs:
      artifact_suffix:
        description: "Suffix appended to the uploaded artifact name"
        required: false
        type: string
        default: ""

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake libssl-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DREVERSI_ENABLE_GUI_TESTS=OFF
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        # net.tls_public checks the real trust store (Windows certificate
        # store, macOS /etc/ssl/cert.pem, Linux system bundle) against public
        # hosts; unreachable hosts are reported as skipped.
        env:
          REVERSI_TLS_PUBLIC: "1"
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release -B package

      - name: Normalize checksum line endings
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/package/*.sha256 | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($_.FullName, $text)
          }

      - name: Windows package version smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/package/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath build/package/smoke -Force
          $exe = Get-ChildItem build/package/smoke -Recurse -Filter reversi.exe |
            Select-Object -First 1
          $root = Split-Path $exe.FullName -Parent
          $server = Join-Path $root 'bin/reversi_server.exe'

          # The package must carry its own OpenSSL runtime: the game links it
          # and so does the server, in a different directory.
          foreach ($dir in @($root, (Join-Path $root 'bin'))) {
            foreach ($pattern in @('libssl-*.dll', 'libcrypto-*.dll')) {
              if (-not (Get-ChildItem $dir -Filter $pattern -ErrorAction SilentlyContinue)) {
                throw "Missing $pattern in $dir"
              }
            }
          }

          # Run with a PATH that cannot reach a system OpenSSL, so a missing
          # bundled DLL fails here instead of on a user's machine.
          $env:PATH = "$root;C:\Windows\System32;C:\Windows"
          $output = (& $exe.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "reversi.exe --version exited with $LASTEXITCODE"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($output -notmatch "^Reversi $([regex]::Escape($version)) ") {
            throw "Unexpected version output: $output"
          }
          if (-not (Test-Path $server)) {
            throw "Missing bin/reversi_server.exe"
          }
          $help = (& $server --help 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'usage:') {
            throw "Packaged server does not start: $help"
          }

      - name: Windows runtime dependency check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # RELEASE.md promises no Visual C++ Redistributable. The executables
          # use the static CRT; the bundled OpenSSL DLLs come from the runner
          # and must not pull in VCRUNTIME/MSVCP either. The version smoke
          # above cannot see this: System32 on the runner has those DLLs.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $root = Split-Path (Get-ChildItem build/package/smoke -Recurse -Filter reversi.exe |
            Select-Object -First 1).FullName -Parent
          $binaries = @(Get-ChildItem $root -Recurse -Include *.exe, *.dll)
          $bad = @()
          foreach ($file in $binaries) {
            $deps = & $dumpbin.FullName /nologo /dependents $file.FullName
            Write-Host "== $($file.Name)"
            $deps | Where-Object { $_ -match '\.dll' } | ForEach-Object { Write-Host "   $($_.Trim())" }
            if ($deps -match '(?i)(vcruntime|msvcp)[0-9_]*\.dll') {
              $bad += $file.Name
            }
          }
          if ($bad.Count -gt 0) {
            throw "Needs the Visual C++ runtime: $($bad -join ', ')"
          }

      - name: macOS package check
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p build/package/smoke
          unzip -q build/package/*.zip -d build/package/smoke
          app=$(find build/package/smoke -name Reversi.app -maxdepth 3 | head -1)
          test -n "$app"
          for binary in "$app/Contents/MacOS/Reversi" \
                        $(find build/package/smoke -name reversi_server -type f); do
            echo "== $binary"
            otool -L "$binary"
            # Only system libraries may be load-time dependencies; a
            # Homebrew path would not exist on a player's Mac.
            if otool -L "$binary" | tail -n +2 \
                | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
              echo "non-system dynamic dependency in $binary" >&2
              exit 1
            fi
          done
          version=$(tr -d '[:space:]' < VERSION)
          output=$("$app/Contents/MacOS/Reversi" --version)
          echo "$output"
          case "$output" in
            "Reversi $version "*) ;;
            *) echo "unexpected version output" >&2; exit 1 ;;
          esac

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Reversi-${{ matrix.name }}${{ inputs.artifact_suffix }}
          path: |
            build/package/*.zip
            build/package/*.tar.gz
            build/package/*.sha256
          if-no-files-found: error
