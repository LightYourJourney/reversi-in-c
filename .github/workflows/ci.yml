name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }} Debug
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DREVERSI_ENABLE_GUI_TESTS=OFF
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Test (no window)
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build -C Debug --output-on-failure

  package:
    name: Release package
    needs: build-test
    uses: ./.github/workflows/package.yml
    with:
      artifact_suffix: "-Release"

  linux-gui:
    name: Linux Xvfb GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake xvfb libgl1-mesa-dri \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure with GUI tests
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DREVERSI_ENABLE_GUI_TESTS=ON
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Smoke and autoplay under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >
          xvfb-run -a -s "-screen 0 1100x800x24"
          ctest --test-dir build -C Debug --output-on-failure
          -R "app.smoke|app.autoplay"

  linux-package:
    name: Linux packaged smoke
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libgl1-mesa-dri unzip libasound2-dev \
            libx11-6 libxrandr2 libxi6 libgl1 \
            libglu1-mesa libxcursor1 libxinerama1 libwayland-client0 \
            libxkbcommon0

      - name: Download Linux Release package
        uses: actions/download-artifact@v4
        with:
          name: Reversi-Linux-Release
          path: artifacts

      - name: Verify package under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >
          xvfb-run -a -s "-screen 0 1100x800x24"
          ./scripts/verify-package.sh artifacts/Reversi-*.zip

  sanitizers:
    name: Linux ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake xvfb libgl1-mesa-dri \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DREVERSI_ENABLE_GUI_TESTS=ON
          -DREVERSI_ENABLE_ASAN=ON
          -DREVERSI_ENABLE_UBSAN=ON
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build-sanitize --parallel 4

      - name: Headless tests
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build-sanitize -C Debug --output-on-failure
          -E "app.smoke|app.autoplay"

      - name: GUI smoke under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          xvfb-run -a -s "-screen 0 1100x800x24"
          ctest --test-dir build-sanitize -C Debug --output-on-failure
          -R "app.smoke|app.autoplay"
