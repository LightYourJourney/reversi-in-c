name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            build_type: Debug
          - os: ubuntu-latest
            name: Linux
            build_type: Release
          - os: windows-latest
            name: Windows
            build_type: Debug
          - os: windows-latest
            name: Windows
            build_type: Release
          - os: macos-latest
            name: macOS
            build_type: Debug
          - os: macos-latest
            name: macOS
            build_type: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DREVERSI_ENABLE_GUI_TESTS=OFF
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: >
          cmake --build build
          --config ${{ matrix.build_type }}
          --parallel 4

      - name: Test (no window)
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build
          -C ${{ matrix.build_type }}
          --output-on-failure

      - name: Package
        if: matrix.build_type == 'Release'
        working-directory: build
        run: cpack -C Release -B package

      - name: Normalize checksum line endings
        if: matrix.build_type == 'Release' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/package/*.sha256 | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName).Replace("`r`n", "`n")
            [IO.File]::WriteAllText($_.FullName, $text)
          }

      - name: Windows package version smoke
        if: matrix.build_type == 'Release' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/package/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath build/package/smoke -Force
          $exe = Get-ChildItem build/package/smoke -Recurse -Filter reversi.exe |
            Select-Object -First 1
          $output = (& $exe.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "reversi.exe --version exited with $LASTEXITCODE"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($output -notmatch "^Reversi $([regex]::Escape($version)) ") {
            throw "Unexpected version output: $output"
          }

      - name: Upload package and checksum
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Reversi-${{ runner.os }}-${{ matrix.build_type }}
          path: |
            build/package/*.zip
            build/package/*.tar.gz
            build/package/*.sha256
          if-no-files-found: error

  linux-gui:
    name: Linux Xvfb GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake xvfb libgl1-mesa-dri \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure with GUI tests
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DREVERSI_ENABLE_GUI_TESTS=ON
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Smoke and autoplay under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >
          xvfb-run -a -s "-screen 0 1100x800x24"
          ctest --test-dir build -C Debug --output-on-failure
          -R "app.smoke|app.autoplay"

  linux-package:
    name: Linux packaged smoke
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libgl1-mesa-dri unzip libasound2-dev \
            libx11-6 libxrandr2 libxi6 libgl1 \
            libglu1-mesa libxcursor1 libxinerama1 libwayland-client0 \
            libxkbcommon0

      - name: Download Linux Release package
        uses: actions/download-artifact@v4
        with:
          name: Reversi-Linux-Release
          path: artifacts

      - name: Verify package under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: >
          xvfb-run -a -s "-screen 0 1100x800x24"
          ./scripts/verify-package.sh artifacts/Reversi-*.zip

  sanitizers:
    name: Linux ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake xvfb libgl1-mesa-dri \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DREVERSI_ENABLE_GUI_TESTS=ON
          -DREVERSI_ENABLE_ASAN=ON
          -DREVERSI_ENABLE_UBSAN=ON
          -DREVERSI_FORCE_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build-sanitize --parallel 4

      - name: Headless tests
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build-sanitize -C Debug --output-on-failure
          -E "app.smoke|app.autoplay"

      - name: GUI smoke under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: >
          xvfb-run -a -s "-screen 0 1100x800x24"
          ctest --test-dir build-sanitize -C Debug --output-on-failure
          -R "app.smoke|app.autoplay"
